<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<title>Luma Source Code Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- Highlight.js theme (dynamic) --><link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><style>
body {
  margin: 0;
  font-family: monospace;
  background: #020617;
  color: #e2e8f0;
}

header {
  padding: 15px;
  background: #0f172a;
  font-size: 18px;
  font-weight: bold;
}

.topbar {
  display: flex;
  gap: 10px;
  padding: 10px;
  flex-wrap: wrap;
}

input, button, select {
  padding: 10px;
  border: none;
  border-radius: 5px;
}

input {
  flex: 1;
  background: #0f172a;
  color: white;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}

select {
  background: #0f172a;
  color: white;
}

.container {
  display: flex;
  height: calc(100vh - 120px);
}

.sidebar {
  width: 25%;
  border-right: 1px solid #1e293b;
  padding: 10px;
  overflow-y: auto;
}

.viewer {
  width: 75%;
  padding: 10px;
  overflow-y: auto;
}

.file {
  padding: 6px;
  background: #0f172a;
  margin-bottom: 5px;
  border-radius: 5px;
  cursor: pointer;
}

.file:hover {
  background: #1e293b;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.tabs button {
  background: #0f172a;
}

.console {
  background: black;
  height: 300px;
  overflow-y: auto;
  padding: 10px;
}

#consoleInput {
  width: 100%;
  margin-top: 5px;
  background: #020617;
  color: white;
}

pre {
  white-space: pre-wrap;
}

/* Lock screen */
#lockScreen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #020617;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}
</style></head><body><!-- LOCK SCREEN --><div id="lockScreen">
  <h2>🔐 Luma Access</h2>
  <input id="accessKey" placeholder="Enter access key">
  <button onclick="unlock()">Unlock</button>
  <p id="error" style="color:red;"></p>
</div><header>🌌 Luma Source Code Viewer</header><div class="topbar">
  <input id="urlInput" placeholder="Enter URL https://example.com">
  <button onclick="getSource()">View</button>
  <button onclick="download()">Download</button>  <!-- Theme selector -->  <select onchange="changeTheme(this.value)">
    <option value="github-dark">Dark</option>
    <option value="monokai">Monokai</option>
    <option value="atom-one-dark">Atom Dark</option>
    <option value="dracula">Dracula</option>
  </select>
</div><div class="container">  <!-- Sidebar -->  <div class="sidebar">
    <input id="search" placeholder="Search..." oninput="filterFiles()"><h4>HTML</h4>
<div id="htmlFiles"></div>

<h4>CSS</h4>
<div id="cssFiles"></div>

<h4>JS</h4>
<div id="jsFiles"></div>

  </div>  <!-- Viewer -->  <div class="viewer"><div class="tabs">
  <button onclick="switchTab('source')">Source</button>
  <button onclick="switchTab('console')">Console</button>
  <button onclick="switchTab('info')">Info</button>
</div>

<div id="sourceTab">
  <pre><code id="output" class="language-html">Locked</code></pre>
</div>

<div id="consoleTab" style="display:none;">
  <div id="console" class="console"></div>
  <input id="consoleInput" placeholder="Type command..." onkeydown="runConsole(event)">
</div>

<div id="infoTab" style="display:none;">
  <div id="info"></div>
</div>

  </div></div><script>
let allFiles = [];
let currentHTML = "";

const proxy = (url) =>
  "https://api.allorigins.win/get?url=" + encodeURIComponent(url);

/* LOCK */
const KEY = "luma123";
function unlock() {
  const input = document.getElementById("accessKey").value;
  const error = document.getElementById("error");

  if (input === KEY) {
    document.getElementById("lockScreen").style.display = "none";
  } else {
    error.textContent = "Wrong key";
  }
}

/* THEME */
function changeTheme(theme) {
  const old = document.getElementById("hljs-theme");
  if (old) old.remove();

  const link = document.createElement("link");
  link.id = "hljs-theme";
  link.rel = "stylesheet";
  link.href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${theme}.min.css`;

  document.head.appendChild(link);
}

/* MAIN FETCH */
async function getSource() {
  const url = document.getElementById("urlInput").value;
  const output = document.getElementById("output");

  if (!url) return;

  output.textContent = "Loading...";
  clearFiles();

  try {
    const res = await fetch(proxy(url));
    const data = await res.json();

    currentHTML = data.contents;
    output.textContent = currentHTML;
    hljs.highlightElement(output);

    extractFiles(currentHTML);

  } catch {
    output.textContent = "Error loading source";
  }
}

function extractFiles(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, "text/html");

  const css = [...doc.querySelectorAll("link[rel='stylesheet']")].map(l => l.href);
  const js = [...doc.querySelectorAll("script[src]")].map(s => s.src);

  displayGroup("htmlFiles", ["Main Document"], true);
  displayGroup("cssFiles", css);
  displayGroup("jsFiles", js);

  showInfo(doc);
}

function displayGroup(id, files, isMain=false) {
  const container = document.getElementById(id);
  container.innerHTML = "";

  files.forEach(file => {
    const div = document.createElement("div");
    div.className = "file";
    div.textContent = file;

    div.onclick = () => {
      if (isMain) showMainHTML();
      else viewFile(file);
    };

    container.appendChild(div);
  });
}

function showMainHTML() {
  const output = document.getElementById("output");
  output.className = "language-html";
  output.textContent = currentHTML;
  hljs.highlightElement(output);
}

async function viewFile(url) {
  const output = document.getElementById("output");
  output.textContent = "Loading file...";

  try {
    const res = await fetch(proxy(url));
    const data = await res.json();

    if (url.endsWith(".js")) output.className = "language-javascript";
    else if (url.endsWith(".css")) output.className = "language-css";
    else output.className = "language-html";

    output.textContent = data.contents;
    hljs.highlightElement(output);

  } catch {
    output.textContent = "Error loading file";
  }
}

function filterFiles() {
  const search = document.getElementById("search").value.toLowerCase();
  const filtered = allFiles.filter(f => f.toLowerCase().includes(search));

  displayGroup("cssFiles", filtered.filter(f => f.endsWith(".css")));
  displayGroup("jsFiles", filtered.filter(f => f.endsWith(".js")));
}

function download() {
  const text = document.getElementById("output").textContent;
  const blob = new Blob([text], { type: "text/plain" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "luma-source.txt";
  a.click();
}

function switchTab(tab) {
  document.getElementById("sourceTab").style.display = "none";
  document.getElementById("consoleTab").style.display = "none";
  document.getElementById("infoTab").style.display = "none";

  document.getElementById(tab + "Tab").style.display = "block";
}

function runConsole(e) {
  if (e.key === "Enter") {
    const input = e.target.value;
    const consoleDiv = document.getElementById("console");

    const line = document.createElement("div");
    line.textContent = "> " + input;

    consoleDiv.appendChild(line);
    e.target.value = "";
  }
}

function showInfo(doc) {
  const info = document.getElementById("info");

  const title = doc.querySelector("title")?.innerText || "No title";
  const links = doc.querySelectorAll("a").length;
  const scripts = doc.querySelectorAll("script").length;

  info.innerHTML = `
    <h3>Page Info</h3>
    <p><b>Title:</b> ${title}</p>
    <p><b>Links:</b> ${links}</p>
    <p><b>Scripts:</b> ${scripts}</p>
  `;
}
</script></body>
</html>
